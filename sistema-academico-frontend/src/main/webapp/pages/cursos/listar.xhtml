<!DOCTYPE html>
<ui:composition template="/template/template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets"
	xmlns:p="http://primefaces.org/ui">

	<ui:define name="conteudo">

		<h:form id="formCurso">

			<p:growl id="growl" showDetail="true" life="3000" />

			<p:toolbar styleClass="mb-3">

				<p:toolbarGroup>

					<h2 style="margin: 0">
						<i class="pi pi-book"></i> Cadastro de Cursos
					</h2>

				</p:toolbarGroup>

				<p:toolbarGroup align="right">

					<p:commandButton value="Novo Curso" icon="pi pi-plus"
						process="@this" action="#{cursoBean.novoCurso}"
						update=":formCurso:dialogCurso" oncomplete="PF('dlgCurso').show()" />

				</p:toolbarGroup>

			</p:toolbar>

			<p:dataTable id="tabela" value="#{cursoBean.cursos}" var="curso"
				paginator="true" rows="10" stripedRows="true"
				responsiveLayout="scroll" emptyMessage="Nenhum curso encontrado.">



				<p:column headerText="Nome">

                    #{curso.nome}

                </p:column>

				<p:column headerText="Descrição">

                    #{curso.descricao}

                </p:column>

				<p:column headerText="Ações" width="180">

					<p:commandButton icon="pi pi-pencil" styleClass="ui-button-warning"
						process="@this" action="#{cursoBean.editarCurso(curso)}"
						update=":formCurso:dialogCurso" oncomplete="PF('dlgCurso').show()" />

					<p:spacer width="10" />

					<p:commandButton icon="pi pi-trash" styleClass="ui-button-danger"
						process="@this" action="#{cursoBean.excluirCurso(curso)}"
						update="@form growl">

						<p:confirm header="Confirmação"
							message="Deseja excluir este curso?"
							icon="pi pi-exclamation-triangle" />

					</p:commandButton>

				</p:column>

			</p:dataTable>

			<p:confirmDialog global="true" showEffect="fade" hideEffect="fade"
				responsive="true">

				<p:commandButton value="Sim" type="button"
					styleClass="ui-confirmdialog-yes ui-button-danger" />

				<p:commandButton value="Não" type="button"
					styleClass="ui-confirmdialog-no ui-button-secondary" />

			</p:confirmDialog>

			<p:dialog id="dialogCurso" header="Cadastro de Curso"
				widgetVar="dlgCurso" modal="true" resizable="false"
				responsive="true" width="600">

				<p:panelGrid columns="2" layout="grid"
					columnClasses="col-12 md:col-3,col-12 md:col-9"
					styleClass="ui-fluid">

					<p:outputLabel for="nome" value="Nome" />

					<p:inputText id="nome" value="#{cursoBean.curso.nome}"
						required="true" requiredMessage="Informe o nome do curso." />

					<p:outputLabel for="descricao" value="Descrição" />

					<p:inputTextarea id="descricao" rows="4" autoResize="false"
						value="#{cursoBean.curso.descricao}" required="true"
						requiredMessage="Informe a descrição." />

				</p:panelGrid>

				<f:facet name="footer">

					<p:commandButton value="Salvar" icon="pi pi-save"
						action="#{cursoBean.salvarCurso}" update=":formCurso"
						oncomplete="if(!args.validationFailed) PF('dlgCurso').hide();" />

					<p:commandButton value="Cancelar" icon="pi pi-times" type="button"
						styleClass="ui-button-secondary" onclick="PF('dlgCurso').hide()" />

				</f:facet>

			</p:dialog>

		</h:form>

	</ui:define>

</ui:composition>
