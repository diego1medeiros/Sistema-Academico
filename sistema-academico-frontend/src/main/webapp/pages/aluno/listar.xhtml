<!DOCTYPE html>
<ui:composition template="/template/template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets"
	xmlns:p="http://primefaces.org/ui">

	<ui:define name="conteudo">

		<h:form id="formAluno">

			<p:growl id="msg" showDetail="true" life="3000" />

			<p:toolbar styleClass="mb-3">

				<p:toolbarGroup>

					<h2 style="margin: 0">
						<i class="pi pi-book"></i> Cadastro de Alunos
					</h2>

				</p:toolbarGroup>

				<p:toolbarGroup align="right">

					<p:commandButton value="Novo aluno" icon="pi pi-plus"
						process="@this" action="#{alunoBean.novoAluno}"
						update=":formAluno:dialogAluno" oncomplete="PF('dlgAluno').show()" />

				</p:toolbarGroup>

			</p:toolbar>

			<p:dataTable id="tabela" value="#{alunoBean.alunos}" var="aluno"
				paginator="true" rows="10" stripedRows="true"
				responsiveLayout="scroll" emptyMessage="Nenhum aluno encontrado.">


				<p:column headerText="Nome">
                    #{aluno.nome}
                </p:column>

				<p:column headerText="Email">
                    #{aluno.email}
                </p:column>

				<p:column headerText="Cpf">
                    #{aluno.cpf}
                </p:column>

				<p:column headerText="Ações" width="180">

					<p:commandButton icon="pi pi-pencil" styleClass="ui-button-warning"
						process="@this" action="#{alunoBean.editarAluno(aluno)}"
						update=":formAluno:dialogAluno" oncomplete="PF('dlgAluno').show()" />

					<p:spacer width="10" />

					<p:commandButton icon="pi pi-trash" styleClass="ui-button-danger"
						process="@this" action="#{alunoBean.excluirAluno(aluno)}"
						update="@form msg">

						<p:confirm header="Confirmação"
							message="Deseja excluir este aluno?"
							icon="pi pi-exclamation-triangle" />

					</p:commandButton>

				</p:column>

			</p:dataTable>

			<p:confirmDialog global="true" showEffect="fade" hideEffect="fade"
				responsive="true">

				<p:commandButton value="Sim" type="button"
					styleClass="ui-confirmdialog-yes ui-button-danger" />

				<p:commandButton value="Não" type="button"
					styleClass="ui-confirmdialog-no ui-button-secondary" />

			</p:confirmDialog>

			<p:dialog id="dialogAluno" header="Cadastro de Aluno"
				widgetVar="dlgAluno" modal="true" resizable="false"
				responsive="true" width="600">

				<p:panelGrid columns="2" layout="grid"
					columnClasses="col-12 md:col-3,col-12 md:col-9"
					styleClass="ui-fluid">

					<p:outputLabel for="nome" value="Nome" />

					<p:inputText id="nome" value="#{alunoBean.aluno.nome}"
						required="true" requiredMessage="Informe o nome do aluno." />

					<p:outputLabel for="email" value="Email" />

					<p:inputText id="email" rows="4" autoResize="false"
						value="#{alunoBean.aluno.email}" required="true"
						requiredMessage="Informe a email." />

					<p:outputLabel for="cpf" value="Cpf" />

					<p:inputMask id="cpf" rows="4" autoResize="false"
						mask="999.999.999-99" value="#{alunoBean.aluno.cpf}"
						required="true" validateMask="true"
						requiredMessage="Informe a cpf." />

				</p:panelGrid>

				<f:facet name="footer">

					<p:commandButton value="Salvar" icon="pi pi-save"
						action="#{alunoBean.salvarAluno}" update=":formAluno"
						oncomplete="if(!args.validationFailed) PF('dlgAluno').hide();" />

					<p:commandButton value="Cancelar" icon="pi pi-times" type="button"
						styleClass="ui-button-secondary" onclick="PF('dlgAluno').hide()" />

				</f:facet>

			</p:dialog>

		</h:form>

	</ui:define>

</ui:composition>
