<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="jakarta.faces.facelets">

<h:head>

    <title>Sistema Acadêmico</title>

    <h:outputStylesheet library="css" name="style.css"/>

</h:head>

<h:body style="
    background-image:url('#{resource['images/background.png']}');
    background-size:cover;
    background-repeat:no-repeat;
    background-position:center;
    background-attachment:fixed;">

    <div style="height:100vh; display:flex; flex-direction:column;">

        <!-- Cabeçalho -->
        <div style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:15px 30px;
            background:rgba(255,255,255,.92);
            border-bottom:1px solid #dcdcdc;
            box-shadow:0 2px 8px rgba(0,0,0,.15);">

            <h2 style="
                margin:0;
                color:#1565C0;
                font-size:32px;
                font-weight:bold;">

                🎓 Sistema Acadêmico

            </h2>

            <h:form>

                <p:menuButton
                    value="#{sessionScope.NOME}"
                    icon="pi pi-user"
                    styleClass="ui-button-info">

                    <p:menuitem
                        value="#{sessionScope.PERFIL}"
                        icon="pi pi-id-card"
                        disabled="true"/>

                    <p:separator/>

                    <p:menuitem
                        value="Sair"
                        icon="pi pi-sign-out"
                        action="#{usuarioBean.logout}"/>

                </p:menuButton>

            </h:form>

        </div>

        <!-- Corpo -->
        <div style="flex:1; display:flex;">

            <!-- Menu -->
            <div style="
                width:260px;
                background:rgba(255,255,255,.92);
                border-right:1px solid #ddd;
                padding:15px;">

                <p:menu>

                    <p:menuitem
                        value="Dashboard"
                        icon="pi pi-home"
                        url="/pages/dashboard.xhtml"/>

                    <p:menuitem
                        value="Alunos"
                        icon="pi pi-users"
                        url="/pages/aluno/listar.xhtml"/>

                    <p:menuitem
                        value="Cursos"
                        icon="pi pi-book"
                        url="/pages/cursos/listar.xhtml"/>

                    <p:menuitem
                        value="Disciplinas"
                        icon="pi pi-list"
                        url="/pages/disciplina/listar.xhtml"/>

                    <p:menuitem
                        value="Turmas"
                        icon="pi pi-calendar"
                        url="/pages/turma/listar.xhtml"/>

                    <p:menuitem
                        value="Matrículas"
                        icon="pi pi-check-square"
                        url="/pages/matricula/listar.xhtml"/>
                        
                        <p:menuitem
    value="Usuários" rendered="#{usuarioBean.admin}"
    icon="pi pi-user"
    url="/pages/usuario/listar.xhtml"/>

                </p:menu>

            </div>

            <!-- Conteúdo -->
            <div style="
                flex:1;
                padding:25px;
                overflow:auto;">

                <ui:insert name="conteudo"/>

            </div>

        </div>

    </div>

</h:body>

</html>
