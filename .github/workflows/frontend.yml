name: Frontend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  build-frontend:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout do código
        uses: actions/checkout@v4


      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven


      - name: Build Frontend JSF
        working-directory: sistema-academico-frontend
        run: mvn clean package -DskipTests
